<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<section th:replace="~{fragments/layout :: layout('Receivables', ~{::main})}">
    <main>
        <section class="panel">
            <form method="get" th:action="@{/receivables}" class="form-row">
                <div><label>Date</label><input class="date-input" name="date" type="text" th:value="${date != null ? #temporals.format(date, 'dd-MM-yyyy') : ''}" placeholder="dd-mm-yyyy" autocomplete="off"></div>
                <button class="button secondary" type="submit">Load</button>
            </form>
        </section>
        <section class="panel">
            <form method="post" th:action="@{/receivables}" th:object="${receivable}" class="form-row">
                <input type="hidden" th:field="*{createdBy}">
                <input type="hidden" th:field="*{updatedBy}">
                <div>
                    <label>Party</label>
                    <select th:field="*{partyId}" required>
                        <option value="">Select</option>
                        <option th:each="party : ${parties}" th:value="${party.id}" th:text="${party.name}">Party</option>
                    </select>
                </div>
                <div><label>Amount</label><input th:field="*{amount}" type="number" step="0.01" required></div>
                <div><label>Transaction Date</label><input class="date-input" type="text" id="transactionDate" name="transactionDate" th:value="${receivable.transactionDate != null ? #temporals.format(receivable.transactionDate, 'dd-MM-yyyy') : ''}" placeholder="dd-mm-yyyy" autocomplete="off" required></div>
                <button class="button" type="submit">Add Receivable</button>
            </form>
        </section>
        <section class="panel">
            <table>
                <thead><tr><th>Transaction Date</th><th>Party</th><th>Amount</th><th>Action</th></tr></thead>
                <tbody>
                <tr th:each="item : ${receivables}">
                    <td th:text="${#temporals.format(item.transactionDate, 'dd-MM-yyyy')}">Date</td>
                    <td th:text="${item.partyModel != null ? item.partyModel.name : '-'}">Party</td>
                    <td th:text="${#numbers.formatDecimal(item.amount, 1, 2)}">0.00</td>
                    <td><form method="post" th:action="@{/receivables/{id}/delete(id=${item.id})}"><button class="button danger" type="submit">Delete</button></form></td>
                </tr>
                </tbody>
            </table>
        </section>
    </main>
</section>
</body>
</html>
