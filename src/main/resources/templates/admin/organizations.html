<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Organizations', ~{::body/content})}">
<body>
<content>
    <div class="panel">
        <h2>Create Organization</h2>
        <form th:action="@{/admin/organizations}" method="post">
            <div class="form-row">
                <div>
                    <label>Name</label>
                    <input type="text" name="name" required placeholder="Organization name">
                </div>
                <div>
                    <label>Subscription</label>
                    <select name="subscriptionType">
                        <option th:each="st : ${subscriptionTypes}" th:value="${st}" th:text="${st}"></option>
                    </select>
                </div>
                <div>
                    <label>Max Users <span style="font-size:11px;color:var(--muted)">(PER_USER only)</span></label>
                    <input type="number" name="maxUsers" min="1" placeholder="Leave blank for unlimited">
                </div>
                <div>
                    <label>Agreement Notes</label>
                    <input type="text" name="agreementNotes" placeholder="Optional notes">
                </div>
            </div>
            <div style="margin-top:14px;">
                <button type="submit" class="button">Create Organization</button>
            </div>
        </form>
    </div>

    <div class="panel">
        <h2>All Organizations</h2>
        <table>
            <thead>
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>Subscription</th>
                <th>Max Users</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="org : ${organizations}">
                <td style="color:var(--muted);font-size:13px;" th:text="${org.id}"></td>
                <td><strong th:text="${org.name}"></strong></td>
                <td>
                    <span class="badge amber" th:text="${org.subscriptionType}"></span>
                </td>
                <td style="color:var(--muted);" th:text="${org.maxUsers != null ? org.maxUsers : 'Unlimited'}"></td>
                <td>
                    <span th:if="${org.isActive}" class="badge green">Active</span>
                    <span th:unless="${org.isActive}" class="badge red">Inactive</span>
                </td>
                <td>
                    <div class="actions">
                        <a th:href="@{/admin/organizations/{id}/users(id=${org.id})}" class="button secondary sm">Users</a>
                        <form th:action="@{/admin/organizations/{id}/delete(id=${org.id})}" method="post" style="display:inline;"
                              onsubmit="return confirm('Deactivate this organization?')">
                            <button type="submit" class="button danger sm">Deactivate</button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(organizations)}">
                <td colspan="6" style="text-align:center;color:var(--muted);padding:24px;">No organizations yet.</td>
            </tr>
            </tbody>
        </table>
    </div>
</content>
</body>
</html>
