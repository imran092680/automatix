<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<section th:replace="~{fragments/layout :: layout('Sales', ~{::main})}">
    <main>
        <section class="panel">
            <form method="get" th:action="@{/sales}" class="form-row">
                <div><label>Date</label><input class="date-input" name="date" type="text" th:value="${date != null ? #temporals.format(date, 'dd-MM-yyyy') : ''}" placeholder="dd-mm-yyyy" autocomplete="off"></div>
                <button class="button secondary" type="submit">Load</button>
            </form>
        </section>
        <section class="panel">
            <form method="post" th:action="@{/sales}" th:object="${sale}" class="form-row" id="salesForm">
                <input type="hidden" th:field="*{createdBy}">
                <input type="hidden" th:field="*{updatedBy}">
                <div>
                    <label>Product</label>
                    <select th:field="*{productId}" required>
                        <option value="">Select</option>
                        <option th:each="product : ${products}" th:value="${product.id}" th:text="${product.name}">Product</option>
                    </select>
                </div>
                <div>
                    <label>Party</label>
                    <select th:field="*{partyId}" required>
                        <option value="">Select</option>
                        <option th:each="party : ${parties}" th:value="${party.id}" th:text="${party.name}">Party</option>
                    </select>
                </div>
                <div><label>Quantity</label><input th:field="*{count}" id="count" type="number" step="0.01" required></div>
                <div><label>Rate</label><input th:field="*{pricePerUnit}" id="pricePerUnit" type="number" step="0.01" required></div>
                <div><label>Discount</label><input th:field="*{discount}" id="discount" type="number" step="0.01"></div>
                <div><label>Amount</label><input th:field="*{amount}" id="amount" type="number" step="0.01" required></div>
                <div><label>Transaction Date</label><input class="date-input" type="text" id="transactionDate" name="transactionDate" th:value="${sale.transactionDate != null ? #temporals.format(sale.transactionDate, 'dd-MM-yyyy') : ''}" placeholder="dd-mm-yyyy" autocomplete="off" required></div>
                <button class="button" type="submit">Add Sale</button>
            </form>
        </section>
        <section class="panel">
            <table>
                <thead><tr><th>Transaction Date</th><th>Product</th><th>Party</th><th>Qty</th><th>Rate</th><th>Discount</th><th>Amount</th><th>Action</th></tr></thead>
                <tbody>
                <tr th:each="item : ${sales}">
                    <td th:text="${#temporals.format(item.transactionDate, 'dd-MM-yyyy')}">Date</td>
                    <td th:text="${item.productModel.name}">Product</td>
                    <td th:text="${item.partyModel.name}">Party</td>
                    <td th:text="${item.count}">0</td>
                    <td th:text="${#numbers.formatDecimal(item.pricePerUnit, 1, 2)}">0.00</td>
                    <td th:text="${#numbers.formatDecimal(item.discount, 1, 2)}">0.00</td>
                    <td th:text="${#numbers.formatDecimal(item.amount, 1, 2)}">0.00</td>
                    <td><form method="post" th:action="@{/sales/{id}/delete(id=${item.id})}"><button class="button danger" type="submit">Delete</button></form></td>
                </tr>
                </tbody>
            </table>
        </section>
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                const fields = ['count', 'pricePerUnit', 'discount'];
                function updateAmount() {
                    const count = Number(document.getElementById('count').value || 0);
                    const price = Number(document.getElementById('pricePerUnit').value || 0);
                    const discount = Number(document.getElementById('discount').value || 0);
                    document.getElementById('amount').value = ((count * price) - discount).toFixed(2);
                }
                fields.forEach((id) => document.getElementById(id).addEventListener('input', updateAmount));
            });
        </script>
    </main>
</section>
</body>
</html>
