<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('Manage Users', ~{::body/content})}">
<body>
<content>

    <!-- Stats Strip -->
    <div class="stats-mini">
        <div class="stat-mini">
            <div class="smi-icon smi-green">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
            </div>
            <div>
                <div class="smi-label">Total Users</div>
                <div class="smi-value" th:text="${#lists.size(users)}">0</div>
            </div>
        </div>
        <div class="stat-mini">
            <div class="smi-icon smi-blue">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                    <polyline points="22 4 12 14.01 9 11.01"/>
                </svg>
            </div>
            <div>
                <div class="smi-label">Active</div>
                <div class="smi-value" th:text="${users.?[isActive == true].size()}">0</div>
            </div>
        </div>
        <div class="stat-mini">
            <div class="smi-icon smi-purple">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
            </div>
            <div>
                <div class="smi-label">Admins</div>
                <div class="smi-value" th:text="${users.?[role != null and role.name() == 'ORG_ADMIN'].size()}">0</div>
            </div>
        </div>
    </div>

    <!-- Add New User -->
    <div class="panel">
        <div class="form-section-label">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px;">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
                <line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/>
            </svg>
            Add New User
        </div>
        <form th:action="@{/org-admin/users}" method="post">
            <div class="form-row">
                <div>
                    <label>Username</label>
                    <input type="text" name="username" required placeholder="e.g. john.doe" autocomplete="off">
                </div>
                <div>
                    <label>Password</label>
                    <input type="password" name="password" required placeholder="••••••••" autocomplete="new-password">
                </div>
                <div>
                    <label>Full Name</label>
                    <input type="text" name="fullName" required placeholder="John Doe">
                </div>
                <div>
                    <label>Email</label>
                    <input type="email" name="email" placeholder="john@example.com">
                </div>
            </div>
            <div class="form-footer">
                <div class="ff-role">
                    <label>Role</label>
                    <select name="role">
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                    </select>
                </div>
                <button type="submit" class="button">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                    Add User
                </button>
            </div>
        </form>
    </div>

    <!-- Users Table -->
    <div class="panel">
        <div class="table-toolbar">
            <div style="display:flex;align-items:center;">
                <h3>Team Members</h3>
                <span class="user-count-badge" id="visibleCount" th:text="${#lists.size(users)}">0</span>
            </div>
            <div class="search-wrap">
                <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="text" id="userSearch" placeholder="Search users…">
            </div>
        </div>
        <table id="userTable">
            <thead>
            <tr>
                <th>User</th>
                <th>Full Name</th>
                <th>Role</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td>
                    <div class="user-cell">
                        <span class="user-avatar"
                              th:text="${#strings.toUpperCase(#strings.substring(user.username, 0, 1))}"></span>
                        <div class="user-cell-info">
                            <strong th:text="${user.username}"></strong>
                            <span class="email-hint" th:text="${user.email != null ? user.email : '—'}"></span>
                        </div>
                    </div>
                </td>
                <td th:text="${user.fullName}"></td>
                <td>
                    <span th:text="${user.role}"
                          th:classappend="${user.role != null and user.role.name() == 'ORG_ADMIN'} ? 'badge blue' : 'badge grey'"></span>
                </td>
                <td>
                    <span th:if="${user.isActive}" class="badge green">Active</span>
                    <span th:unless="${user.isActive}" class="badge red">Inactive</span>
                </td>
                <td>
                    <div class="actions">
                        <form th:action="@{/org-admin/users/{id}/toggle-active(id=${user.id})}" method="post" style="display:inline;">
                            <button type="submit"
                                    th:class="${user.isActive ? 'button secondary sm' : 'button sm'}"
                                    style="display:inline-flex;align-items:center;gap:5px;">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/><line x1="12" y1="2" x2="12" y2="12"/>
                                </svg>
                                <span th:text="${user.isActive ? 'Disable' : 'Enable'}"></span>
                            </button>
                        </form>
                        <form th:action="@{/org-admin/users/{id}/delete(id=${user.id})}" method="post" style="display:inline;"
                              onsubmit="return confirm('Remove this user?')">
                            <button type="submit" class="button danger sm" style="display:inline-flex;align-items:center;gap:5px;">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="3 6 5 6 21 6"/>
                                    <path d="M19 6l-1 14H6L5 6"/>
                                    <path d="M10 11v6"/><path d="M14 11v6"/>
                                    <path d="M9 6V4h6v2"/>
                                </svg>
                                Remove
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(users)}" id="emptyStateRow">
                <td colspan="5">
                    <div class="empty-state">
                        <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                        <p>No users yet. Add the first one above.</p>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <script>
        (function () {
            // Color avatars using golden-angle hue distribution
            document.querySelectorAll('.user-avatar').forEach(function (el) {
                var code = el.textContent.trim().charCodeAt(0);
                el.style.background = 'hsl(' + (code * 137) % 360 + ', 60%, 40%)';
            });

            // Live search filter
            var input = document.getElementById('userSearch');
            var badge = document.getElementById('visibleCount');
            if (!input) return;
            input.addEventListener('input', function () {
                var q = this.value.toLowerCase().trim();
                var rows = document.querySelectorAll('#userTable tbody tr:not(#emptyStateRow)');
                var count = 0;
                rows.forEach(function (row) {
                    var match = !q || row.textContent.toLowerCase().indexOf(q) !== -1;
                    row.style.display = match ? '' : 'none';
                    if (match) count++;
                });
                if (badge) badge.textContent = count;
            });
        })();
    </script>

</content>
</body>
</html>
