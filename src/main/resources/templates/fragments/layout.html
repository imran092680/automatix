<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(pageTitle, bodyContent)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle + ' | ' + appName}">Automatix</title>
    <link rel="stylesheet" th:href="@{/css/automatix.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>
<div class="shell">
    <aside class="sidebar">
        <div class="brand">Automatix</div>
        <div class="brand-subtitle">Spring Boot + Thymeleaf</div>
        <nav>
            <a class="nav-link" th:href="@{/}">Dashboard</a>
            <a class="nav-link" th:href="@{/cash-in}">Cash In</a>
            <a class="nav-link" th:href="@{/cash-out}">Cash Out</a>
            <a class="nav-link" th:href="@{/sales}">Sales</a>
            <a class="nav-link" th:href="@{/receivables}">Receivables</a>
            <a class="nav-link" th:href="@{/stock}">Stock</a>
            <a class="nav-link" th:href="@{/banks}">Banks</a>
            <a class="nav-link" th:href="@{/products}">Products</a>
            <a class="nav-link" th:href="@{/parties}">Parties</a>
            <a class="nav-link" th:href="@{/measurement-units}">Units</a>
        </nav>
    </aside>
    <main class="content">
        <div class="topbar">
            <h1 class="title" th:text="${pageTitle}">Page</h1>
            <strong>Abdullah Traders</strong>
        </div>
        <div th:if="${success}" class="alert success" th:text="${success}"></div>
        <div th:if="${error}" class="alert error" th:text="${error}"></div>
        <th:block th:replace="${bodyContent}"></th:block>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        flatpickr('.date-input', { dateFormat: 'd-m-Y' });
    });
</script>
</body>
</html>
