<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Automatix</title>
    <link rel="stylesheet" th:href="@{/css/automatix.css}">
    <style>
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f5f5f5; }
        .login-card { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 100%; max-width: 360px; }
        .login-card h1 { font-size: 1.5rem; margin-bottom: 1.5rem; text-align: center; }
        .login-card .brand { text-align: center; font-weight: bold; font-size: 1.2rem; color: #333; margin-bottom: 0.25rem; }
        .login-card .brand-sub { text-align: center; font-size: 0.8rem; color: #888; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.25rem; font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; box-sizing: border-box; }
        .btn-primary { width: 100%; padding: 0.6rem; background: #333; color: #fff; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
        .btn-primary:hover { background: #555; }
        .alert { padding: 0.75rem; border-radius: 4px; margin-bottom: 1rem; font-size: 0.9rem; }
        .alert.error { background: #fee; border: 1px solid #fcc; color: #c00; }
        .alert.success { background: #efe; border: 1px solid #cfc; color: #060; }
    </style>
</head>
<body>
<div class="login-card">
    <div class="brand">Automatix</div>
    <div class="brand-sub">Plan, Build, Scale</div>
    <div th:if="${error}" class="alert error" th:text="${error}"></div>
    <div th:if="${message}" class="alert success" th:text="${message}"></div>
    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn-primary">Sign In</button>
    </form>
</div>
</body>
</html>
